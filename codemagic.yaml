# Codemagic(クラウドのMac)でiOSアプリをビルドし、TestFlightへ配信する設定。
# 手元のMacは最新Xcodeが使えないため、ビルド・署名・アップロードはすべてここで行う。
# 事前にCodemagicの「Team integrations」でApp Store Connect APIキーを
# 「pocket-base-asc」という名前で登録しておくこと。
workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: pocket-base-asc
    environment:
      groups:
        # CERTIFICATE_PRIVATE_KEY(証明書を新規作成する際に使うRSA秘密鍵)を含む
        - ios_signing
      vars:
        BUNDLE_ID: "com.kaitooofficial.pocketbase"
      node: 22
      xcode: latest
    scripts:
      - name: npmパッケージのインストール
        script: npm ci
      - name: Capacitorの設定をiOSプロジェクトへ反映
        script: npx cap sync ios
      - name: キーチェーンの初期化
        script: keychain initialize
      - name: 証明書・プロビジョニングプロファイルを取得(無ければ新規作成)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: 署名設定をXcodeプロジェクトに適用
        script: xcode-project use-profiles
      - name: ビルド番号をCodemagicの通し番号にする(TestFlightは同じ番号を受け付けないため)
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: ipaファイルのビルド
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
